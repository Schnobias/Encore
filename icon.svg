<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0f172a" stroke="#334155" stroke-width="12"/>
  
  <!-- Dice 1 (Amber) -->
  <g transform="translate(100, 100) rotate(-8 100 100)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#facc15" stroke="#713f12" stroke-width="8"/>
    <circle cx="45" cy="45" r="16" fill="#020617"/>
    <circle cx="115" cy="45" r="16" fill="#020617"/>
    <circle cx="80" cy="80" r="16" fill="#020617"/>
    <circle cx="45" cy="115" r="16" fill="#020617"/>
    <circle cx="115" cy="115" r="16" fill="#020617"/>
  </g>

  <!-- Dice 2 (Emerald) -->
  <g transform="translate(250, 240) rotate(12 100 100)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#22c55e" stroke="#14532d" stroke-width="8"/>
    <circle cx="45" cy="45" r="16" fill="#020617"/>
    <circle cx="115" cy="115" r="16" fill="#020617"/>
  </g>

  <text x="256" y="450" font-family="Fredoka One, sans-serif" font-size="54" font-weight="bold" fill="#facc15" text-anchor="middle" letter-spacing="2">ENCORE!</text>
</svg>
